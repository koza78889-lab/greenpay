<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GreenPay — NFC Банк</title>
  <!-- Иконка приложения для Windows и Android -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%2321a038%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22>G</text></svg>">
  <style>
    :root {
      --bg: #0b0f0c;
      --card-bg: #151c17;
      --accent: #21a038;
      --accent-glow: #2ee650;
      --text: #ffffff;
      --text-muted: #8b968e;
      --danger: #ff4d4d;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hidden {
      display: none !important;
    }

    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 22px;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .logo-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-glow);
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #0e1310;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .input:focus {
      border-color: var(--accent-glow);
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #0d521a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 19px;
    }

    .profile-name {
      font-weight: 700;
      font-size: 17px;
    }

    .role-badge {
      font-size: 11px;
      color: var(--accent-glow);
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .small-top-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Карта */
    .bank-card {
      background: linear-gradient(135deg, #1d8a31 0%, #0a3d14 100%);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(33, 160, 56, 0.25);
      position: relative;
      overflow: hidden;
    }

    .bank-card::after {
      content: "";
      position: absolute;
      right: -40px;
      bottom: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-logo {
      font-weight: 800;
      font-size: 20px;
    }

    .balance-label {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .balance-amount {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.85;
      font-family: monospace;
    }

    /* Поле NFC ссылки в профиле */
    .nfc-profile-box {
      background: var(--card-bg);
      border: 1px solid rgba(46, 230, 80, 0.25);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nfc-box-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-glow);
    }

    .nfc-url-row {
      display: flex;
      gap: 8px;
    }

    .nfc-url-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b0f0c;
      color: var(--text-muted);
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }

    .btn-copy-small {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Кнопки действий */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-card {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-card.primary {
      background: var(--accent);
      border-color: var(--accent-glow);
    }

    /* Админ панель */
    .admin-panel {
      background: #141a16;
      border: 1px solid rgba(46, 230, 80, 0.35);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-glow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-plus {
      background: #1f9d35;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-minus {
      background: var(--danger);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* История */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-top: 4px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 30px;
    }

    .tx-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(33, 160, 56, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .tx-title {
      font-weight: 600;
      font-size: 14px;
    }

    .tx-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .tx-amount.plus { color: var(--accent-glow); }
    .tx-amount.minus { color: var(--danger); }

    /* Модалка */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .receiver-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(33, 160, 56, 0.15);
      border: 1px solid rgba(46, 230, 80, 0.35);
      padding: 12px 16px;
      border-radius: 18px;
      width: 100%;
      text-align: left;
    }

    .sum-big-input {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      border: 2px solid var(--accent-glow);
      background: #0b0f0c;
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="authScreen" class="auth-box">
      <div class="logo-title">GreenPay</div>
      <p style="color: var(--text-muted); font-size: 13px;">Вход или создание счета (По умолчанию 0 ₽)</p>
      <input type="text" id="authLogin" class="input" placeholder="Логин (например, Kazel)">
      <input type="password" id="authPass" class="input" placeholder="Пароль">
      <div id="authError" style="color: var(--danger); font-size: 13px; min-height: 18px;"></div>
      <button class="btn-main" onclick="handleLogin()">Войти в банк</button>
      <button class="btn-main btn-secondary" onclick="handleRegister()">Зарегистрироваться (0 ₽)</button>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН БАНКА -->
    <div id="walletScreen" class="hidden" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="header">
        <div class="profile">
          <div class="avatar" id="userAvatar">К</div>
          <div>
            <div class="profile-name" id="userNameDisplay">Kazel</div>
            <div class="role-badge" id="userRoleDisplay">Клиент</div>
          </div>
        </div>
        <div class="header-btns">
          <button class="small-top-btn" onclick="syncData(true)" title="Обновить баланс">🔄</button>
          <button class="small-top-btn" onclick="logout()">Выйти</button>
        </div>
      </div>

      <!-- КАРТА -->
      <div class="bank-card">
        <div class="card-top">
          <div class="card-logo">GreenPay</div>
          <div id="cloudStatus" style="font-size: 12px; opacity: 0.9;">🟢 Online</div>
        </div>
        <div class="balance-label">Доступный баланс</div>
        <div class="balance-amount" id="balanceDisplay">0 ₽</div>
        <div class="card-bottom">
          <span id="cardNumDisplay">•••• 7788</span>
          <span>NFC PAY</span>
        </div>
      </div>

      <!-- ССЫЛКА В ПРОФИЛЕ ДЛЯ NFC МЕТКИ -->
      <div class="nfc-profile-box">
        <div class="nfc-box-header">🏷️ Моя ссылка для NFC-метки (приём оплаты)</div>
        <div class="nfc-url-row">
          <input type="text" id="profileNfcUrl" class="nfc-url-input" readonly>
          <button class="btn-copy-small" onclick="copyMyProfileNfcUrl()">Копировать</button>
        </div>
      </div>

      <!-- КНОПКИ ПЕРЕВОДА И ОПЛАТЫ -->
      <div class="actions">
        <button class="btn-card primary" onclick="openManualTransferModal()">
          <span style="font-size: 20px;">💸</span>
          <span>Перевести клиенту</span>
        </button>
        <button class="btn-card" onclick="testNfcTap()">
          <span style="font-size: 20px;">📲</span>
          <span>Оплата по NFC</span>
        </button>
      </div>

      <!-- АДМИН-ПАНЕЛЬ (Видна только для Kazel) -->
      <div id="adminPanel" class="admin-panel hidden">
        <div class="admin-title">
          <span>👑 Управление банком (Kazel)</span>
          <button class="small-top-btn" onclick="openCloudSetupModal()" style="font-size: 11px;">☁️ База</button>
        </div>
        <label style="font-size: 12px; color: var(--text-muted);">Выбери аккаунт для начисления ЗП / списания:</label>
        <select id="adminTargetUser" class="input"></select>
        <input type="number" id="adminAmount" class="input" placeholder="Сумма в ₽ (например: 5000)">
        <input type="text" id="adminComment" class="input" placeholder="Комментарий (Зарплата / Бонус / Штраф)">
        <div class="admin-grid">
          <button class="btn-plus" onclick="adminChangeBalance(1)">+ Начислить ЗП</button>
          <button class="btn-minus" onclick="adminChangeBalance(-1)">- Вычесть</button>
        </div>
        <button class="btn-main btn-secondary" style="font-size: 12px; padding: 10px;" onclick="copySelectedUserNfcLink()">
          🔗 Скопировать NFC-ссылку выбранного юзера
        </button>
      </div>

      <div class="section-title">История операций</div>
      <div class="history-list" id="historyList"></div>
    </div>

  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    const ADMIN_LOGIN = "Kazel";
    const ADMIN_PASS = "Goat7788!";
    let pendingNfcReceiver = null;

    // URL облачной базы Firebase Realtime Database (можно задать в настройках админа)
    function getFirebaseUrl() {
      return localStorage.getItem('https://greenpay-c330a-default-rtdb.firebaseio.com') || '';
    }

    function getLocalUsers() {
      const raw = localStorage.getItem('gp_users_db');
      let users = raw ? JSON.parse(raw) : {};
      if (!users[ADMIN_LOGIN]) {
        users[ADMIN_LOGIN] = {
          pass: ADMIN_PASS,
          balance: 0,
          role: "Администратор банка",
          card: "•••• 7788",
          history: []
        };
        localStorage.setItem('gp_users_db', JSON.stringify(users));
      }
      return users;
    }

    // Сохранение + синхронизация с облаком (если подключено)
    async function saveUsers(users) {
      localStorage.setItem('gp_users_db', JSON.stringify(users));
      const fbUrl = getFirebaseUrl();
      if (fbUrl) {
        try {
          await fetch(`${fbUrl.replace(/\/$/, '')}/users.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(users)
          });
        } catch (e) {
          console.warn("Ошибка синхронизации с облаком:", e);
        }
      }
    }

    // Загрузка актуальных балансов из облака
    async function syncData(showToast = false) {
      const fbUrl = getFirebaseUrl();
      if (fbUrl) {
        try {
          const res = await fetch(`${fbUrl.replace(/\/$/, '')}/users.json`);
          if (res.ok) {
            const cloudUsers = await res.json();
            if (cloudUsers && typeof cloudUsers === 'object') {
              // Восстанавливаем пустые массивы истории, если Firebase их опустил
              Object.keys(cloudUsers).forEach(k => {
                if (!cloudUsers[k].history) cloudUsers[k].history = [];
                if (typeof cloudUsers[k].balance !== 'number') cloudUsers[k].balance = Number(cloudUsers[k].balance) || 0;
              });
              localStorage.setItem('gp_users_db', JSON.stringify(cloudUsers));
            }
          }
        } catch (e) {}
      }
      if (getCurrentUser()) renderWallet();
      if (showToast) playSuccessSound();
    }

    function getCurrentUser() {
      return localStorage.getItem('gp_current_user');
    }

    function formatMoney(num) {
      return (Number(num) || 0).toLocaleString('ru-RU') + ' ₽';
    }

    function getTimeStr() {
      const now = new Date();
      return `Сегодня, ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function getUserNfcLink(username) {
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?to=${encodeURIComponent(username)}`;
    }

    // Вход
    async function handleLogin() {
      await syncData();
      const loginInput = document.getElementById('authLogin').value.trim();
      const pass = document.getElementById('authPass').value;
      const err = document.getElementById('authError');

      if (!loginInput || !pass) {
        err.textContent = "Введите логин и пароль";
        return;
      }

      const users = getLocalUsers();

      // Поиск логина без учета регистра
      if (loginInput.toLowerCase() === ADMIN_LOGIN.toLowerCase() && pass === ADMIN_PASS) {
        localStorage.setItem('gp_current_user', ADMIN_LOGIN);
        err.textContent = "";
        initApp();
        return;
      }

      const foundKey = Object.keys(users).find(k => k.toLowerCase() === loginInput.toLowerCase());
      if (!foundKey || users[foundKey].pass !== pass) {
        err.textContent = "Неверный логин или пароль";
        return;
      }

      localStorage.setItem('gp_current_user', foundKey);
      err.textContent = "";
      initApp();
    }

    // Регистрация (Баланс 0 ₽)
    async function handleRegister() {
      await syncData();
      const login = document.getElementById('authLogin').value.trim();
      const pass = document.getElementById('authPass').value;
      const err = document.getElementById('authError');

      if (!login || !pass) {
        err.textContent = "Придумайте логин и пароль";
        return;
      }

      const users = getLocalUsers();
      const exists = Object.keys(users).some(k => k.toLowerCase() === login.toLowerCase());
      if (exists) {
        err.textContent = "Такой логин уже существует! Нажмите «Войти».";
        return;
      }

      users[login] = {
        pass: pass,
        balance: 0,
        role: "Клиент GreenPay",
        card: "•••• " + Math.floor(1000 + Math.random() * 9000),
        history: []
      };

      await saveUsers(users);
      localStorage.setItem('gp_current_user', login);
      err.textContent = "";
      initApp();
    }

    function logout() {
      localStorage.removeItem('gp_current_user');
      initApp();
    }

    function renderWallet() {
      const currentLogin = getCurrentUser();
      const users = getLocalUsers();
      if (!users[currentLogin]) {
        logout();
        return;
      }
      const user = users[currentLogin];

      document.getElementById('userAvatar').textContent = currentLogin[0].toUpperCase();
      document.getElementById('userNameDisplay').textContent = currentLogin;
      document.getElementById('userRoleDisplay').textContent = user.role || "Клиент";
      document.getElementById('balanceDisplay').textContent = formatMoney(user.balance);
      document.getElementById('cardNumDisplay').textContent = user.card || "•••• 0000";
      document.getElementById('profileNfcUrl').value = getUserNfcLink(currentLogin);

      document.getElementById('cloudStatus').textContent = getFirebaseUrl() ? "☁️ Cloud Sync" : "📱 Local Mode";

      // Админ панель для Kazel
      const adminPanel = document.getElementById('adminPanel');
      if (currentLogin === ADMIN_LOGIN) {
        adminPanel.classList.remove('hidden');
        const select = document.getElementById('adminTargetUser');
        const prev = select.value || currentLogin;
        select.innerHTML = '';
        Object.keys(users).forEach(uName => {
          const opt = document.createElement('option');
          opt.value = uName;
          opt.textContent = `${uName} (Баланс: ${formatMoney(users[uName].balance)})`;
          if (uName === prev) opt.selected = true;
          select.appendChild(opt);
        });
      } else {
        adminPanel.classList.add('hidden');
      }

      // История
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const hist = user.history || [];

      if (hist.length === 0) {
        list.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 18px;">Операций пока нет (Баланс 0 ₽)</div>`;
      } else {
        hist.forEach(item => {
          const div = document.createElement('div');
          div.className = 'tx-item';
          const isPlus = Number(item.amount) > 0;
          div.innerHTML = `
            <div class="tx-left">
              <div class="tx-icon">${item.icon || (isPlus ? '📥' : '📤')}</div>
              <div>
                <div class="tx-title">${item.title}</div>
                <div class="tx-date">${item.date}</div>
              </div>
            </div>
            <div class="tx-amount ${isPlus ? 'plus' : 'minus'}">
              ${isPlus ? '+' : ''}${formatMoney(item.amount)}
            </div>
          `;
          list.appendChild(div);
        });
      }
    }

    // Админ: Выдать ЗП или Вычесть
    async function adminChangeBalance(direction) {
      await syncData();
      const targetUser = document.getElementById('adminTargetUser').value;
      const amountInput = document.getElementById('adminAmount');
      const commentInput = document.getElementById('adminComment');

      const rawAmount = Number(amountInput.value);
      if (!rawAmount || rawAmount <= 0) {
        alert("Введите сумму больше 0 ₽!");
        return;
      }

      const defaultTitle = direction > 0 ? "Начисление зарплаты" : "Удержание (Админ)";
      const comment = commentInput.value.trim() || defaultTitle;

      const users = getLocalUsers();
      const user = users[targetUser];
      const delta = rawAmount * direction;

      user.balance = (Number(user.balance) || 0) + delta;
      if (!user.history) user.history = [];
      user.history.unshift({
        title: comment,
        amount: delta,
        date: getTimeStr(),
        icon: direction > 0 ? "💼" : "⚠️"
      });

      await saveUsers(users);
      amountInput.value = '';
      commentInput.value = '';
      playSuccessSound();
      renderWallet();
    }

    // Копирование личной NFC ссылки
    function copyMyProfileNfcUrl() {
      const link = document.getElementById('profileNfcUrl').value;
      navigator.clipboard.writeText(link);
      alert("Ссылка скопирована! Запиши её в NFC Tools -> Запись -> URL:\n\n" + link);
    }

    function copySelectedUserNfcLink() {
      const targetUser = document.getElementById('adminTargetUser').value;
      const link = getUserNfcLink(targetUser);
      navigator.clipboard.writeText(link);
      alert(`NFC-ссылка для ${targetUser} скопирована:\n\n${link}`);
    }

    // МГНОВЕННОЕ ОКНО ПЕРЕВОДА ПО NFC-МЕТКЕ (Вводишь только сумму!)
    function openInstantNfcPayModal(receiverName) {
      const currentLogin = getCurrentUser();
      const users = getLocalUsers();
      const myBalance = users[currentLogin] ? users[currentLogin].balance : 0;

      showModal(`
        <div style="font-size: 36px;">📡</div>
        <h3>Оплата / Перевод по NFC</h3>
        <div class="receiver-pill">
          <div class="avatar" style="width: 38px; height: 38px; font-size: 16px;">${receiverName[0].toUpperCase()}</div>
          <div>
            <div style="font-size: 12px; color: var(--text-muted);">Получатель:</div>
            <div style="font-weight: 800; font-size: 17px; color: #fff;">${receiverName}</div>
          </div>
        </div>
        <p style="color: var(--text-muted); font-size: 13px;">Ваш доступный баланс: <b>${formatMoney(myBalance)}</b></p>
        <input type="hidden" id="transferToInput" value="${receiverName}">
        <input type="number" id="transferAmountInput" class="sum-big-input" placeholder="Сумма ₽" autofocus>
        <input type="text" id="transferMsgInput" class="input" placeholder="Комментарий (необязательно)">
        <div id="transferErr" style="color: var(--danger); font-size: 13px; min-height: 16px;"></div>
        <button class="btn-main" onclick="executeTransfer()">Перевести деньги</button>
        <button class="btn-main btn-secondary" onclick="closeModal()">Отмена</button>
      `);
    }

    // ОБЫЧНОЕ ОКНО ПЕРЕВОДА ПО НИКУ
    function openManualTransferModal() {
      const currentLogin = getCurrentUser();
      const users = getLocalUsers();
      const myBalance = users[currentLogin] ? users[currentLogin].balance : 0;

      let optionsHtml = `<option value="">-- Выбрать получателя из списка --</option>`;
      Object.keys(users).forEach(uName => {
        if (uName.toLowerCase() !== currentLogin.toLowerCase()) {
          optionsHtml += `<option value="${uName}">${uName}</option>`;
        }
      });

      showModal(`
        <div style="font-size: 32px;">💸</div>
        <h3>Перевод клиенту</h3>
        <p style="color: var(--text-muted); font-size: 13px;">Ваш баланс: <b>${formatMoney(myBalance)}</b></p>
        <select class="input" onchange="if(this.value) document.getElementById('transferToInput').value = this.value">
          ${optionsHtml}
        </select>
        <input type="text" id="transferToInput" class="input" placeholder="Логин получателя (например, Kazel)">
        <input type="number" id="transferAmountInput" class="sum-big-input" placeholder="Сумма ₽">
        <input type="text" id="transferMsgInput" class="input" placeholder="Сообщение получателю">
        <div id="transferErr" style="color: var(--danger); font-size: 13px; min-height: 16px;"></div>
        <button class="btn-main" onclick="executeTransfer()">Отправить перевод</button>
        <button class="btn-main btn-secondary" onclick="closeModal()">Отмена</button>
      `);
    }

    function testNfcTap() {
      const currentLogin = getCurrentUser();
      const target = currentLogin === ADMIN_LOGIN ? "Брат" : ADMIN_LOGIN;
      openInstantNfcPayModal(target);
    }

    // ИСПРАВЛЕННАЯ ФУНКЦИЯ ПЕРЕВОДА
    async function executeTransfer() {
      await syncData();
      const senderLogin = getCurrentUser();
      const receiverInput = document.getElementById('transferToInput');
      const amountInput = document.getElementById('transferAmountInput');
      const msgInput = document.getElementById('transferMsgInput');
      const errBox = document.getElementById('transferErr');

      const receiverRaw = receiverInput ? receiverInput.value.trim() : '';
      const amount = Number(amountInput ? amountInput.value : 0);
      const msg = msgInput ? msgInput.value.trim() : '';

      if (!receiverRaw) {
        if (errBox) errBox.textContent = "Укажите логин получателя!";
        return;
      }
      if (!amount || amount <= 0 || isNaN(amount)) {
        if (errBox) errBox.textContent = "Введите сумму больше 0 ₽!";
        return;
      }
      if (receiverRaw.toLowerCase() === senderLogin.toLowerCase()) {
        if (errBox) errBox.textContent = "Нельзя перевести деньги самому себе!";
        return;
      }

      const users = getLocalUsers();
      const sender = users[senderLogin];
      const senderBalance = Number(sender.balance) || 0;

      if (senderBalance < amount) {
        if (errBox) errBox.textContent = `Недостаточно средств! На балансе ${formatMoney(senderBalance)}`;
        return;
      }

      // Находим получателя в базе или создаем ему новый аккаунт автоматически
      let receiverKey = Object.keys(users).find(k => k.toLowerCase() === receiverRaw.toLowerCase());
      if (!receiverKey) {
        receiverKey = receiverRaw;
        users[receiverKey] = {
          pass: "1234",
          balance: 0,
          role: "Клиент GreenPay",
          card: "•••• " + Math.floor(1000 + Math.random() * 9000),
          history: []
        };
      }

      const receiver = users[receiverKey];
      const timeStr = getTimeStr();

      // 1. Вычитаем у отправителя
      sender.balance = senderBalance - amount;
      if (!sender.history) sender.history = [];
      sender.history.unshift({
        title: `Перевод → ${receiverKey}${msg ? ' (' + msg + ')' : ''}`,
        amount: -amount,
        date: timeStr,
        icon: "📤"
      });

      // 2. Прибавляем получателю
      receiver.balance = (Number(receiver.balance) || 0) + amount;
      if (!receiver.history) receiver.history = [];
      receiver.history.unshift({
        title: `Перевод от ${senderLogin}${msg ? ' (' + msg + ')' : ''}`,
        amount: amount,
        date: timeStr,
        icon: "📥"
      });

      await saveUsers(users);
      renderWallet();
      playSuccessSound();
      if (navigator.vibrate) navigator.vibrate([80, 50, 120]);

      showModal(`
        <div style="font-size: 48px;">✅</div>
        <div style="color: var(--text-muted); font-size: 14px;">Перевод успешно выполнен</div>
        <div style="font-size: 34px; font-weight: 800; color: var(--accent-glow);">- ${formatMoney(amount)}</div>
        <div style="font-weight: 700; font-size: 18px;">Получатель: ${receiverKey}</div>
        ${msg ? `<div style="font-size: 13px; color: var(--text-muted);">«${msg}»</div>` : ''}
        <button class="btn-main" onclick="closeModal()">Готово</button>
      `);
    }

    // Окно подключения Firebase для синхронизации между разными телефонами и ПК
    function openCloudSetupModal() {
      const currentUrl = getFirebaseUrl();
      showModal(`
        <h3>☁️ Синхронизация между устройствами</h3>
        <p style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">
          Чтобы переводы мгновенно работали между <b>разными телефонами и ПК</b>, вставь ссылку на свою <b>Firebase Realtime Database</b> (например, <code>https://my-app-default-rtdb.firebaseio.com</code>):
        </p>
        <input type="text" id="fbUrlInput" class="input" placeholder="https://...firebaseio.com" value="${currentUrl}">
        <button class="btn-main" onclick="saveCloudUrl()">Сохранить базу</button>
        <button class="btn-main btn-secondary" onclick="closeModal()">Закрыть</button>
      `);
    }

    async function saveCloudUrl() {
      const val = document.getElementById('fbUrlInput').value.trim();
      localStorage.setItem('gp_firebase_url', val);
      if (val) {
        const users = getLocalUsers();
        await saveUsers(users);
      }
      closeModal();
      renderWallet();
      alert(val ? "Облачная база подключена!" : "Переключено на локальный режим");
    }

    function playSuccessSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function showModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    async function initApp() {
      await syncData();
      const currentLogin = getCurrentUser();

      if (!currentLogin) {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('walletScreen').classList.add('hidden');
      } else {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('walletScreen').classList.remove('hidden');
        renderWallet();

        if (pendingNfcReceiver) {
          const target = pendingNfcReceiver;
          pendingNfcReceiver = null;
          setTimeout(() => openInstantNfcPayModal(target), 250);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('to')) {
        pendingNfcReceiver = params.get('to');
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      initApp();
      // Автообновление баланса каждые 5 секунд при подключенном облаке
      setInterval(() => {
        if (getCurrentUser() && getFirebaseUrl()) syncData();
      }, 5000);
    });
  </script>
